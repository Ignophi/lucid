# Builds a signed APK when a version tag (e.g. v1.0.0) is pushed, and
# attaches it to a GitHub release. Needs the signing secrets described in
# docs/RELEASING.md. Can also be run by hand (Actions > Release > Run
# workflow): then the APK is kept as a download on the run's page.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing, see docs/RELEASING.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter test
      # Phones only (32 and 64-bit ARM): leaves out x86_64, used by emulators
      # and a few Chromebooks, to keep the APK small.
      - run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Name the APK
        run: |
          NAME="lucid-${GITHUB_REF_NAME//\//-}"
          mv build/app/outputs/flutter-apk/app-release.apk "$NAME.apk"
          sha256sum "$NAME.apk" > "$NAME.apk.sha256"
          SIZE=$(stat -c %s "$NAME.apk")
          echo "APK size: $((SIZE / 1024 / 1024)) MB"
          if [ "$SIZE" -gt 31457280 ]; then
            echo "::warning::The APK is over 30 MB, the IzzyOnDroid limit"
          fi

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lucid-*.apk
            lucid-*.apk.sha256
          generate_release_notes: true

      - name: Keep as a download (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: lucid-apk
          path: lucid-*.apk*
